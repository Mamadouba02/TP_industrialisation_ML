input {
  file {
    path => "/logs/api.jsonl"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/churn.sincedb"
    codec => json
  }
}
filter {
  if [timestamp] { date { match => ["timestamp", "ISO8601"] } }
}
output {
  elasticsearch { hosts => ["http://elasticsearch:9200"] index => "churn-logs-%{+YYYY.MM.dd}" }
}
